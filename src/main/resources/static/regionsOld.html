<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">

	<head>
		<title>Crétion d'une région</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	</head>
	
	<body>
		
			<form th:action="@{/createRegion}" th:object="${regionForm}" method="POST">
			
    				<label>Nom Région</label>
    				<input type="text" th:field="*{nomRegion}" placeholder="Nom de la Région" />

    				<button type="submit">Send</button>
			</form>

	</body>
	
</html>
