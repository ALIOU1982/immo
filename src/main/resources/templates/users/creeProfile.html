<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">

	<head>
		<title>Ajouter un profil</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Créer</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
	</head>
	
<body>

	<div class="container">
			<h1>Créer</h1>
			<form th:action="@{/users/createProfil}" th:object="${nProfil}" method="post">
			
				<div class="form-group">
					<label for="nomProfil">nom Profil</label>
					<input type="text" id="nomProfil" th:field="*{nomProfil}" class="form-control">
					<div th:if="${#fields.hasErrors('nomProfil')}" th:errors="*{nomProfil}" class="text-danger"></div>
				</div> 
				 
				<button type="submit" class="btn btn-primary">Enregistrer</button>
				 <a href="/users/listeProfils" class="btn btn-primary">Annuler</a>
				
			</form>			
			
		</div>
<body>

</body>
</html>
