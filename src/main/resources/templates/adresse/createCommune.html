<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">

	<head>
		<title>Ajouter une région</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Ajout</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
	</head>
	
<body>
	
	<div class="container">
			<h1>Ajouter</h1>
			<form th:action="@{/adresse/createCommune}" th:object="${nCommune}" method="post">
			
				<div class="form-group">
					<label for="nomCommunen">nomCommune</label>
					<input type="text" id="nomCommune" th:field="*{nomCommune}" class="form-control">
					<select class="form-control" id="listRegion">
    					<option value="0">select Region</option>
    					<option th:each="option : ${regions}" th:value="${option.id}" th:text="${option.nomRegion}"></option>
					</select>
					<div th:if="${#fields.hasErrors('nomCommune')}" th:errors="*{nomCommune}" class="text-danger"></div>
				</div> 
				 
				<button type="submit" class="btn btn-primary">Enregistrer</button>
				 <a href="/adresse/listeRegions" class="btn btn-primary">Annuler</a>
				<!--
				<button th:href="@{/adresse/listeRegions}" class="btn btn-primary">Annuler</button> 
				  -->
				
			</form>			
			
		</div>
</body>
</html>
