<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">


<head>
	<title>Editer une région</title>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Modifier le nom</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>

	<div class="container">
			<h1>Modifier</h1>
			<form th:action="@{/adresse/editionRegion/{id}(id = ${idRegion})}" th:object="${nEditRegion}" th:method="put">
			
				<div class="form-group">
					<label for="nomRegion">nom Region</label>
 					<input type="text" id="nomRegion" th:field="*{nomRegion}" class="form-control">
				</div> 
				 
				<button type="submit" class="btn btn-primary">Enregistrer</button>
				<a href="/adresse/listeRegions" class="btn btn-primary">Annuler</a>
				
			</form>			
			
		</div>

</body>
</html>
